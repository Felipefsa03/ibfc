name: ibfc

# ==============================================================================
# IBFC — Laravel 13 + Inertia + React
#
#   Uso:
#     cp .env.example .env
#     docker compose up -d --build
#
#   Acesso: http://localhost:${APP_PORT:-8080}
#   phpMyAdmin (opcional): docker compose --profile tools up -d  -> :8081
#
#   Produção: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        APP_ENV: ${APP_ENV:-local}
    image: ibfc-app:latest
    container_name: ibfc-app
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-IBFC}
      APP_ENV: ${APP_ENV:-local}
      # APP_KEY vem do arquivo .env (montado abaixo), não do compose.
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-ibfc}
      DB_USERNAME: ${DB_USERNAME:-ibfc}
      DB_PASSWORD: ${DB_PASSWORD:-ibfc_secret}
      SESSION_DRIVER: database
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      FILESYSTEM_DISK: local
      BROADCAST_CONNECTION: log
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: ${APP_NAME:-IBFC}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    volumes:
      - .env:/var/www/html/.env
      - shared_public:/var/www/html/public
      - app_storage:/var/www/html/storage
    networks:
      - ibfc_network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "/usr/local/bin/healthcheck.php"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  nginx:
    image: nginx:stable-alpine
    container_name: ibfc-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - shared_public:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro
    networks:
      - ibfc_network
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  db:
    image: mysql:8.4
    container_name: ibfc-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ibfc}
      MYSQL_USER: ${DB_USERNAME:-ibfc}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ibfc_secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ibfc_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ibfc-pma
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-ibfc}
      PMA_PASSWORD: ${DB_PASSWORD:-ibfc_secret}
      UPLOAD_LIMIT: 64M
    ports:
      - "${PMA_PORT:-8081}:80"
    networks:
      - ibfc_network
    depends_on:
      - db

volumes:
  mysql_data:
  app_storage:
  shared_public:

networks:
  ibfc_network:
    driver: bridge
