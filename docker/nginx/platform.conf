# Configuração do nginx para o container de PLATAFORMA (single-container).
# O php-fpm roda no MESMO container, portanto fastcgi_pass usa 127.0.0.1:9000.
# (No docker-compose, o nginx é um container separado e usa docker/nginx/default.conf)

server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    server_tokens off;

    client_max_body_size 20M;

    # ---- Headers de segurança ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ---- Gzip ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    # ---- Icons ----
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ---- Assets compilados (nomes com hash, cache imutável) ----
    location ^~ /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
        access_log off;
    }

    # ---- Arquivos enviados (symlink storage:link) ----
    location ^~ /storage/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # ---- Demais estáticos ----
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
        access_log off;
    }

    # ---- SPA / Inertia ----
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ---- PHP ----
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_hide_header X-Powered-By;
    }

    # ---- Bloqueia arquivos ocultos (.env, .git etc.) ----
    location ~ /\.(?!well-known) {
        deny all;
    }
}
