; ===== IBFC — configuração PHP-FPM =====
; Carregado em /usr/local/etc/php/conf.d/zz-laravel.ini

; ---- Uploads ----
upload_max_filesize = 20M
post_max_size = 21M
max_execution_time = 120
max_input_time = 120
memory_limit = 256M

; ---- OPcache ----
; Para produção estrita, defina validate_timestamps=0 (reconstrói a imagem a cada deploy).
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 2
opcache.validate_timestamps = 1
opcache.fast_shutdown = 1

; ---- Erros e logs ----
log_errors = On
display_errors = Off
error_reporting = E_ALL
error_log = /var/www/html/storage/logs/php-error.log

; ---- Diversos ----
date.timezone = UTC
realpath_cache_size = 4096K
realpath_cache_ttl = 600
